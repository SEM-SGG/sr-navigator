name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check version, changelog and release settings
        run: node scripts/release-info.mjs
      - name: Check the version in the product documentation
        run: node scripts/check-dokumentation.mjs
      - name: Run core tests
        run: npm run test:core
        env:
          SR_NO_NET: "1"
      - name: Run release script tests
        run: npm run test:release
      - name: Run unit tests
        run: npm run test:app:unit
      - name: Build the navigator
        run: npm run build
      - name: Build the project page
        run: npm run site
      - name: Run browser tests in Chrome
        run: npx playwright test -c test/app/playwright.config.mjs --project=chrome
        env:
          NO_NET: "1"
      - name: Upload the built files
        uses: actions/upload-artifact@v4
        with:
          name: sr-navigator
          path: |
            dist/sr-navigator.html
            dist/site
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
