name: Release

# Veröffentlicht eine neue Version, sobald «version» in package.json auf main steigt, und stellt danach die Projektseite
# mit der Versionsangabe (version.json) bereit. Der Navigator liest diese Angabe, um auf neue Versionen hinzuweisen.
# Der manuelle Start wiederholt einen unterbrochenen Lauf. Besteht die Release schon, baut er nur die Projektseite neu.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - site/**
      - scripts/build-site.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Decide whether a release is due
        id: plan
        run: bash scripts/publish-release.sh plan
      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        run: npm ci
      - name: Run core tests
        if: steps.plan.outputs.build == 'true'
        run: npm run test:core
        env:
          SR_NO_NET: "1"
      - name: Run release script tests
        if: steps.plan.outputs.build == 'true'
        run: npm run test:release
      - name: Run unit tests
        if: steps.plan.outputs.build == 'true'
        run: npm run test:app:unit
      - name: Build the navigator
        if: steps.plan.outputs.build == 'true'
        run: npm run build
      - name: Publish the release
        if: steps.plan.outputs.build == 'true'
        run: bash scripts/publish-release.sh publish

  pages:
    name: Deploy the project page
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the page for the published version
        run: |
          version="$(node scripts/release-info.mjs --version)"
          asset="$(node scripts/release-info.mjs --asset)"
          date="$(gh release view "v${version}" --json publishedAt --jq '.publishedAt[0:10]')"
          gh release download "v${version}" --pattern "${asset}" --dir dist
          node scripts/build-site.mjs --date "${date}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
