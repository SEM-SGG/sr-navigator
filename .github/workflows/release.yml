name: Release

# Veröffentlicht eine neue Version, sobald «version» in package.json auf main steigt, und stellt danach die Projektseite
# mit der Versionsangabe (version.json), der Produktdokumentation (dokumentation.html) und dem Navigator unter app/
# bereit. Der Navigator liest die Versionsangabe, um auf neue Versionen hinzuweisen. Vor der Veröffentlichung prüft der
# Lauf, ob die Produktdokumentation und package-lock.json die Version aus package.json nennen
# (scripts/check-dokumentation.mjs). Das Bereitstellen der Projektseite versucht der Lauf bis zu dreimal.
# Der manuelle Start wiederholt einen unterbrochenen Lauf. Besteht die Release schon, baut er nur die Projektseite neu.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - site/**
      - scripts/build-site.mjs
      - docs/sr-navigator-dokumentation.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Decide whether a release is due
        id: plan
        run: bash scripts/publish-release.sh plan
      - name: Check the version in the product documentation and package-lock.json
        if: steps.plan.outputs.build == 'true'
        run: node scripts/check-dokumentation.mjs
      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        run: npm ci
      - name: Run core tests
        if: steps.plan.outputs.build == 'true'
        run: npm run test:core
        env:
          SR_NO_NET: "1"
      - name: Run release script tests
        if: steps.plan.outputs.build == 'true'
        run: npm run test:release
      - name: Run unit tests
        if: steps.plan.outputs.build == 'true'
        run: npm run test:app:unit
      - name: Build the navigator
        if: steps.plan.outputs.build == 'true'
        run: npm run build
      - name: Publish the release
        if: steps.plan.outputs.build == 'true'
        run: bash scripts/publish-release.sh publish

  pages:
    name: Deploy the project page
    needs: release
    runs-on: ubuntu-latest
    # Drei Versuche zu höchstens 5 Minuten, 90 Sekunden Wartezeit und der Bau der Seite passen in 25 Minuten.
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      # Adresse des Versuchs, der gelungen ist.
      url: ${{ (steps.deploy1.outcome == 'success' && steps.deploy1.outputs.page_url) || (steps.deploy2.outcome == 'success' && steps.deploy2.outputs.page_url) || steps.deploy3.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the page for the published version
        run: |
          version="$(node scripts/release-info.mjs --version)"
          asset="$(node scripts/release-info.mjs --asset)"
          date="$(gh release view "v${version}" --json publishedAt --jq '.publishedAt[0:10]')"
          gh release download "v${version}" --pattern "${asset}" --dir dist
          node scripts/build-site.mjs --date "${date}" --require-app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      # Bereitstellen mit bis zu drei Versuchen. GitHub meldet manchmal «No artifacts named "github-pages" were found»,
      # obwohl das Hochladen eben gelungen ist; der Fehler entsteht, bevor eine Bereitstellung angelegt wird, und ein
      # späterer Versuch im selben Lauf findet das Artefakt. Die ersten zwei Versuche dürfen scheitern
      # (continue-on-error), der dritte nicht: Scheitern alle drei, wird der Job rot. Jeder Versuch bricht nach
      # 5 Minuten ab und storniert dabei seine Bereitstellung (Eingabe «timeout» von deploy-pages).
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
      - name: Wait before the second attempt
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (second attempt)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
      - name: Wait before the third attempt
        if: steps.deploy2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (third attempt)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
